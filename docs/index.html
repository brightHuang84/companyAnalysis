<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>上市公司年报译文</title>
  <meta name="description" content="按公司检索年报译文。点进公司看每年链接和提炼，点开某一年读完整译文和图表。" />
  <link rel="stylesheet" href="styles.css?v=20260908b" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="index.html">年报译文</a>
    <a href="index.html" class="on">主页</a>
  </nav>

  <header class="hero">
    <p class="kicker">公开年报对照译文</p>
    <h1>先搜公司，再按年读年报</h1>
    <p class="lede">
      主页只负责检索。点进一家公司，先看每年年报的链接和几句提炼；点开某一年，读完整译文，并保留当年能核对的财务图表。
    </p>
    <form class="search-box" id="search-form" role="search">
      <label class="sr" for="q">搜索年报</label>
      <input type="search" id="q" name="q" placeholder="搜公司、产品、年份… 例如 Azure、Windows、人工智能、FY2024" autocomplete="off" />
      <button type="submit">搜索</button>
    </form>
    <p class="hint" id="search-hint">正在读目录…</p>
  </header>

  <section class="wrap" id="results-wrap" hidden>
    <h2 class="section-title" id="results-title">搜索结果</h2>
    <ol class="results" id="results"></ol>
  </section>

  <section class="wrap" id="catalog-wrap">
    <h2 class="section-title">公司</h2>
    <div class="cards" id="catalog"></div>
  </section>

  <footer>
    <p>不是投资建议。有官方中文用官方中文，否则译英文原文。找不到电子档的年份会标明。</p>
  </footer>
  <script src="site.js?v=20260908"></script>
  <script src="home.js?v=20260908"></script>
</body>
</html>
